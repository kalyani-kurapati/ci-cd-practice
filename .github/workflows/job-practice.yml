name: Job dependencies practice
on:
 push:
 workflow_dispatch:
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
  - name: Build application
    run: echo "Building application..."
  test:
    needs: build
    runs-on: ubuntu-latest
    steps: 
    - name: build application
      continue-on-error: true
      run: echo "building application"
  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Run security scan
      run: echo "Running security scaning..."
  deploy: 
    needs: [test,security]
    runs-on: ubuntu-latest
    steps:
    - name: deploy application
      run: echo "Deploying application..."
  notify:
   needs: deploy
   if: success()
   runs-on: ubuntu-latest
   steps: 
   - name: success message
     run: echo "deploying completed successfully!"
  failure- handler:
   needs: deploy
   if: faillure
   runs-on: ubuntu-latest
   steps:
   - name: failure message
     run: echo " something went wrong!"
  
 
   
     
